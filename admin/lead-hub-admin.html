<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lead Hub 後台｜Orikan 李泰欣</title>
<style>
:root {
  --bg: #f4f6fb;
  --panel: #ffffff;
  --text: #172033;
  --muted: #657086;
  --line: #d9e0ec;
  --brand: #21648d;
  --brand-dark: #174763;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
.shell {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 18px 42px;
}
.top {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); letter-spacing: 0; }
p { color: var(--muted); margin: 8px 0 0; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 18px 42px rgba(23, 32, 51, 0.08);
  padding: 18px;
  margin-bottom: 18px;
}
.controls {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr) minmax(160px, 0.6fr) auto auto;
  gap: 12px;
  align-items: end;
}
label { display: grid; gap: 6px; font-weight: 800; color: var(--muted); font-size: 0.9rem; }
input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 12px;
  font: inherit;
  color: var(--text);
}
button, .btn {
  border: 0;
  border-radius: 8px;
  background: var(--brand);
  color: #fff;
  font-weight: 900;
  padding: 12px 16px;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
button:hover, .btn:hover { background: var(--brand-dark); }
button.secondary { background: #eef3f7; color: var(--brand-dark); }
.status { margin-top: 12px; color: var(--muted); font-weight: 700; }
.table-wrap { overflow: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 980px;
}
th, td {
  border-bottom: 1px solid var(--line);
  padding: 11px 10px;
  text-align: left;
  vertical-align: top;
  font-size: 0.92rem;
}
th { color: var(--muted); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.empty { color: var(--muted); padding: 28px; text-align: center; }
@media (max-width: 860px) {
  .top { display: block; }
  .controls { grid-template-columns: 1fr; }
  button, .btn { width: 100%; }
}
</style>
</head>
<body>
<main class="shell">
  <section class="top">
    <div>
      <h1>Lead Hub 後台</h1>
      <p>查詢 AI 銷售天賦問答中心名單。Admin Token 只存在你的瀏覽器，不會寫進 GitHub。</p>
    </div>
  </section>

  <section class="panel">
    <div class="controls">
      <label>Worker URL
        <input id="workerUrl" placeholder="https://deal-alliance-lead-hub.your-subdomain.workers.dev">
      </label>
      <label>Admin Token
        <input id="adminToken" type="password" autocomplete="off" placeholder="貼上 Cloudflare Worker ADMIN_TOKEN">
      </label>
      <label>搜尋
        <input id="query" placeholder="姓名、Email、產業、DISC">
      </label>
      <button id="loadButton">讀取名單</button>
      <button class="secondary" id="exportButton">匯出 CSV</button>
    </div>
    <div class="status" id="status">尚未讀取。</div>
  </section>

  <section class="panel table-wrap">
    <table>
      <thead>
        <tr>
          <th>更新時間</th>
          <th>姓名</th>
          <th>Email</th>
          <th>手機 / LINE</th>
          <th>地區</th>
          <th>產業</th>
          <th>DISC / 生涯</th>
          <th>問題</th>
          <th>目標</th>
          <th>建議課程</th>
          <th>最後事件</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="11" class="empty">輸入 Worker URL 與 Admin Token 後讀取。</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
const workerUrlInput = document.getElementById('workerUrl');
const adminTokenInput = document.getElementById('adminToken');
const queryInput = document.getElementById('query');
const loadButton = document.getElementById('loadButton');
const exportButton = document.getElementById('exportButton');
const statusEl = document.getElementById('status');
const rowsEl = document.getElementById('rows');

workerUrlInput.value = localStorage.getItem('orikanLeadHubWorkerUrl') || '';
adminTokenInput.value = sessionStorage.getItem('orikanLeadHubAdminToken') || '';

loadButton.addEventListener('click', loadLeads);
exportButton.addEventListener('click', exportCsv);
queryInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') loadLeads();
});

async function loadLeads() {
  const settings = readSettings();
  if (!settings) return;
  statusEl.textContent = '讀取中...';
  const url = new URL('/admin/leads', settings.workerUrl);
  url.searchParams.set('limit', '200');
  if (queryInput.value.trim()) url.searchParams.set('q', queryInput.value.trim());
  const response = await fetch(url, {
    headers: { Authorization: `Bearer ${settings.token}` }
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || !data.ok) {
    rowsEl.innerHTML = `<tr><td colspan="11" class="empty">${escapeHtml(data.error || '讀取失敗')}</td></tr>`;
    statusEl.textContent = '讀取失敗。';
    return;
  }
  renderRows(data.leads || []);
  statusEl.textContent = `已讀取 ${(data.leads || []).length} 筆。`;
}

async function exportCsv() {
  const settings = readSettings();
  if (!settings) return;
  statusEl.textContent = '匯出中...';
  const response = await fetch(new URL('/admin/leads.csv', settings.workerUrl), {
    headers: { Authorization: `Bearer ${settings.token}` }
  });
  if (!response.ok) {
    statusEl.textContent = '匯出失敗。';
    return;
  }
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `orikan-leads-${Date.now()}.csv`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  statusEl.textContent = 'CSV 已下載。';
}

function readSettings() {
  const workerUrl = workerUrlInput.value.trim().replace(/\/+$/, '');
  const token = adminTokenInput.value.trim();
  if (!workerUrl || !token) {
    statusEl.textContent = '請輸入 Worker URL 與 Admin Token。';
    return null;
  }
  localStorage.setItem('orikanLeadHubWorkerUrl', workerUrl);
  sessionStorage.setItem('orikanLeadHubAdminToken', token);
  return { workerUrl, token };
}

function renderRows(leads) {
  if (!leads.length) {
    rowsEl.innerHTML = '<tr><td colspan="11" class="empty">目前沒有符合條件的名單。</td></tr>';
    return;
  }
  rowsEl.innerHTML = leads.map((lead) => {
    const problems = parseArray(lead.problems_json).join('、');
    const goals = parseArray(lead.goals_json).join('、');
    const courses = parseArray(lead.course_path_json).map((item) => item.name || item.id || item).join(' → ');
    return `<tr>
      <td class="mono">${escapeHtml(formatDate(lead.updated_at))}</td>
      <td>${escapeHtml(lead.name)}</td>
      <td class="mono">${escapeHtml(lead.email)}</td>
      <td>${escapeHtml(lead.phone)}</td>
      <td>${escapeHtml(lead.region)}</td>
      <td>${escapeHtml(lead.industry)}</td>
      <td>${escapeHtml([lead.disc_type, lead.life_number && `生涯 ${lead.life_number}`].filter(Boolean).join(' / '))}</td>
      <td>${escapeHtml(problems)}</td>
      <td>${escapeHtml(goals)}</td>
      <td>${escapeHtml(courses)}</td>
      <td class="mono">${escapeHtml(lead.last_event_type)}</td>
    </tr>`;
  }).join('');
}

function parseArray(value) {
  try {
    const parsed = JSON.parse(value || '[]');
    return Array.isArray(parsed) ? parsed : [];
  } catch (error) {
    return [];
  }
}

function formatDate(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString('zh-TW', { hour12: false });
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
</script>
</body>
</html>

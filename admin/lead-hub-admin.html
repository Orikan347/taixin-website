<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Intelligence Hub｜內部查詢</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;margin:0;background:#f6f7fb;color:#172033}
main{max-width:1080px;margin:0 auto;padding:28px 18px}
.panel{background:#fff;border:1px solid #d7dde8;border-radius:8px;padding:18px;box-shadow:0 16px 38px rgba(24,33,47,.1)}
.grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
label{font-weight:800;display:grid;gap:6px}
input{padding:11px;border:1px solid #c9d2df;border-radius:6px;font:inherit}
button{padding:11px 15px;border:0;border-radius:6px;background:#1f5f8b;color:#fff;font-weight:900;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:18px;background:#fff}
th,td{text-align:left;padding:10px;border-bottom:1px solid #edf1f6;vertical-align:top}
th{color:#1f5f8b}
.note{color:#667085;font-size:.92rem}
@media(max-width:760px){.grid{grid-template-columns:1fr}table{font-size:.88rem}}
</style>
</head>
<body>
<main>
  <h1>Lead Intelligence Hub</h1>
  <p class="note">內部查詢頁。管理 token 只保存在你的瀏覽器當次輸入，不寫入 repo。</p>
  <section class="panel">
    <div class="grid">
      <label>Worker URL<input id="workerUrl" placeholder="https://your-worker.workers.dev"></label>
      <label>Admin Token<input id="token" type="password" autocomplete="off"></label>
      <button id="loadButton">讀取名單</button>
    </div>
    <div id="status" class="note"></div>
    <table>
      <thead>
        <tr><th>姓名</th><th>Email</th><th>地區</th><th>產業</th><th>DISC / 生涯</th><th>問題</th><th>學習順序</th><th>更新</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
document.getElementById('loadButton').addEventListener('click', loadLeads);
async function loadLeads(){
  const workerUrl=document.getElementById('workerUrl').value.replace(/\/$/,'');
  const token=document.getElementById('token').value;
  const status=document.getElementById('status');
  const rows=document.getElementById('rows');
  if(!workerUrl||!token){status.textContent='請輸入 Worker URL 與 Admin Token。';return;}
  status.textContent='讀取中...';
  const response=await fetch(`${workerUrl}/admin/leads?limit=100`,{headers:{Authorization:`Bearer ${token}`}});
  const data=await response.json();
  if(!response.ok){status.textContent=data.error||'讀取失敗';return;}
  rows.innerHTML=(data.leads||[]).map((lead)=>`
    <tr>
      <td>${escapeHtml(lead.name)}</td>
      <td>${escapeHtml(lead.email)}</td>
      <td>${escapeHtml(lead.region)}</td>
      <td>${escapeHtml(lead.industry)}</td>
      <td>${escapeHtml([lead.disc_type, lead.life_number&&`生涯 ${lead.life_number}`].filter(Boolean).join(' / '))}</td>
      <td>${escapeHtml(parseArray(lead.problems_json).join('、'))}</td>
      <td>${escapeHtml(parseArray(lead.course_path_json).map((item)=>item.name||item.id).join(' -> '))}</td>
      <td>${escapeHtml(lead.updated_at)}</td>
    </tr>`).join('');
  status.textContent=`已讀取 ${(data.leads||[]).length} 筆。`;
}
function parseArray(value){try{const data=JSON.parse(value||'[]');return Array.isArray(data)?data:[]}catch(error){return[]}}
function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]))}
</script>
</body>
</html>
